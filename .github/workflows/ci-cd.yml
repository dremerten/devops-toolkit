name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    paths:
      - 'devops-tools-source/**'
      - 'kubernetes/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'devops-tools-source/**'
      - 'kubernetes/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      prod_tag:
        description: 'Override prod tag (e.g., v12). Leave blank for auto next vN.'
        required: false
        type: string
      target_env:
        description: 'Optional manual deploy target (qa, staging, production)'
        required: false
        type: choice
        options:
          - qa
          - staging
          - production
        default: qa
      image_tag:
        description: 'Optional image tag to deploy (defaults per env)'
        required: false
        default: ''

env:
  DOCKER_IMAGE: dremer10/devops-toolkit
  KUBECONFIG_PATH: ${{ github.workspace }}/.kube/config

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: devops-tools-source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: devops-tools-source
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: devops-tools-source
        run: pnpm lint || echo "Linting completed with warnings"

      - name: Run type check
        working-directory: devops-tools-source
        run: pnpm type-check || echo "Type checking completed"

      - name: Build application
        working-directory: devops-tools-source
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: devops-tools-source/dist
          retention-days: 1

  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      version: ${{ steps.meta.outputs.version }}
      next-prod-tag: ${{ steps.meta.outputs.next-prod-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version and metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          DEPLOYMENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="1.0.${{ github.run_number }}"

          TAGS="${{ env.DOCKER_IMAGE }}:dev"
          NEXT_V_TAG=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | sort -n | tail -1)
            NEXT_TAG_NUMBER=$(( ${LATEST_TAG:-0} + 1 ))
            NEXT_V_TAG="v${NEXT_TAG_NUMBER}"
            TAGS="${TAGS},${{ env.DOCKER_IMAGE }}:${NEXT_V_TAG},${{ env.DOCKER_IMAGE }}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "next-prod-tag=${NEXT_V_TAG}" >> $GITHUB_OUTPUT
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deployment-date=${DEPLOYMENT_DATE}" >> $GITHUB_OUTPUT
          echo "build-number=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./devops-tools-source
          file: ./devops-tools-source/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_DEPLOYMENT_DATE=${{ steps.meta.outputs.deployment-date }}
            VITE_BUILD_NUMBER=${{ steps.meta.outputs.build-number }}
            VITE_VERCEL_GIT_COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Image build summary
        run: |
          echo "### Docker Image Build Summary :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.DOCKER_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get image tag
        id: image-tag
        run: |
          echo "tag=${{ env.DOCKER_IMAGE }}:dev" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-tag.outputs.tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Security scan summary
        if: always()
        run: |
          echo "### Security Scan Results :shield:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.image-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scanner**: Trivy" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for detailed vulnerability report." >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy to Development
    needs: [docker-build-push, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    environment:
      name: development
      url: https://dev-devops-toolkit.dremer10.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Development
        run: |
          kubectl set image deployment/devops-toolkit devops-toolkit=${{ env.DOCKER_IMAGE }}:dev -n devops-toolkit-dev
          kubectl rollout restart deployment/devops-toolkit -n devops-toolkit-dev
          kubectl rollout status deployment/devops-toolkit -n devops-toolkit-dev --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n devops-toolkit-dev -l app=devops-toolkit
          kubectl get httproute -n devops-toolkit-dev devops-toolkit

      - name: Deployment summary
        run: |
          echo "### Development Deployment :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://dev-devops-toolkit.dremer10.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-qa:
    name: Deploy to QA
    needs: [docker-build-push, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'qa')
    environment:
      name: qa
      url: https://qa-devops-toolkit.dremer10.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to QA
        run: |
          IMG_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMG_TAG" ]; then IMG_TAG="dev"; fi
          kubectl set image deployment/devops-toolkit devops-toolkit=${{ env.DOCKER_IMAGE }}:$IMG_TAG -n devops-toolkit-qa
          kubectl rollout restart deployment/devops-toolkit -n devops-toolkit-qa
          kubectl rollout status deployment/devops-toolkit -n devops-toolkit-qa --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n devops-toolkit-qa -l app=devops-toolkit
          kubectl get httproute -n devops-toolkit-qa devops-toolkit

      - name: Deployment summary
        run: |
          echo "### QA Deployment :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: QA" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://qa-devops-toolkit.dremer10.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build-push, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    environment:
      name: staging
      url: https://staging-devops-toolkit.dremer10.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Staging
        run: |
          IMG_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMG_TAG" ]; then IMG_TAG="dev"; fi
          kubectl set image deployment/devops-toolkit devops-toolkit=${{ env.DOCKER_IMAGE }}:$IMG_TAG -n devops-toolkit-staging
          kubectl rollout restart deployment/devops-toolkit -n devops-toolkit-staging
          kubectl rollout status deployment/devops-toolkit -n devops-toolkit-staging --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n devops-toolkit-staging -l app=devops-toolkit
          kubectl get httproute -n devops-toolkit-staging devops-toolkit

      - name: Deployment summary
        run: |
          echo "### Staging Deployment :warning:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging-devops-toolkit.dremer10.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    needs: [docker-build-push, security-scan, deploy-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://devops-toolkit.dremer10.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Production
        run: |
          PROD_TAG_INPUT="${{ github.event.inputs.prod_tag }}"
          AUTO_NEXT="${{ needs.docker-build-push.outputs.next-prod-tag }}"
          if [ -n "$PROD_TAG_INPUT" ]; then
            TAG="$PROD_TAG_INPUT"
          elif [ -n "$AUTO_NEXT" ]; then
            TAG="$AUTO_NEXT"
          else
            LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | sort -n | tail -1)
            NEXT_TAG_NUMBER=$(( ${LATEST_TAG:-0} + 1 ))
            TAG="v${NEXT_TAG_NUMBER}"
          fi
          kubectl set image deployment/devops-toolkit devops-toolkit=${{ env.DOCKER_IMAGE }}:$TAG -n devops-toolkit-production
          kubectl rollout restart deployment/devops-toolkit -n devops-toolkit-production
          kubectl rollout status deployment/devops-toolkit -n devops-toolkit-production --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n devops-toolkit-production -l app=devops-toolkit
          kubectl get httproute -n devops-toolkit-production devops-toolkit

      - name: Deployment summary
        run: |
          echo "### Production Deployment :fire:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://devops-toolkit.dremer10.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Deployed**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY

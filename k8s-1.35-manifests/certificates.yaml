---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devops-toolkit-prod-cert
  namespace: nginx-gateway
spec:
  secretName: devops-toolkit-production-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-gateway
  dnsNames:
  - devops-toolkit.dremer10.com

